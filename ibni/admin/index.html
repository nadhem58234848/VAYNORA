<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المشتركين · ناظم</title>
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0E0E0E;--card2:#161616;--line:#262626;--w:#fff;--mute:#A6A6A6;--dim:#6B6B6B;--red:#E60226;--crim:#9E0019}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--w);font-family:Cairo,system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.top img{width:40px;height:40px}
.top b{font-size:19px;font-weight:900;display:block}.top small{color:var(--mute);font-size:12px;display:block;margin-top:-4px}
.top .rf{margin-right:auto;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.rf svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:26px;font-weight:900}.kpi small{color:var(--mute);font-size:12px;font-weight:700}
h2{font-size:15px;font-weight:800;color:var(--mute);margin:22px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.bars .r{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bars .r span{width:90px;flex:none}.bars .r i{display:block;height:10px;border-radius:9px;background:var(--red)}.bars .r em{font-style:normal;color:var(--mute);font-size:13px}
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap}
.tabs button.on{background:rgba(230,2,38,.16);border-color:var(--red);color:var(--w)}
.sub{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.sub .hd{display:flex;align-items:center;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:14px;background:#1a1a1a;border:1px solid #2a2a2a;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--red)}
.sub .nm{flex:1;min-width:0}.sub .nm b{display:block;font-size:17px;font-weight:800}.sub .nm small{color:var(--mute);font-size:13px}
.badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.badge.ok{border-color:var(--red);color:var(--w);background:rgba(230,2,38,.15)}
.badge.warn{border-color:#5a1a22;color:#ff9aa8}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;color:var(--mute)}.stats b{color:var(--w);font-size:15px}
.chain{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-top:10px}
.chain i{height:12px;border-radius:3px;background:#1c1c1c}.chain i.d{background:var(--red)}.chain i.p{background:var(--crim)}
.hb{margin-top:10px;display:grid;gap:6px}
.hb .r{display:flex;justify-content:space-between;font-size:13px}.hb .r em{font-style:normal;color:var(--mute)}
.pb{height:6px;border-radius:9px;background:#1c1c1c;overflow:hidden}.pb i{display:block;height:100%;background:var(--red)}
.more{margin-top:10px;color:var(--red);font-weight:700;font-size:14px}
.rep{white-space:pre-wrap;font-size:13px;line-height:1.8;background:#080808;border:1px dashed #3a1018;border-radius:14px;padding:12px;margin-top:10px;color:#ddd}
.f{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.f input{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin:10px 0;font-size:15px;direction:ltr}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:16px;text-align:center}
.note{color:var(--mute);font-size:13px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../logo.png" alt=""><div><b>لوحة المشتركين</b><small>ابنِ نفسك · خاصة بناظم</small></div><button class="rf" onclick="load()" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div>
  <div id="app"></div>
</div>
<script>
const K='vay_admin_v1',N=21;let C={},ROWS=null,ERR='',TAB='all',OPEN={};
try{C=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sid(v){const m=String(v).match(/\/d\/([\w-]{20,})/);return m?m[1]:String(v).trim()}
function gviz(id,cb,err){const n='gv'+Date.now(),s=document.createElement('script');let done=false;window[n]=r=>{done=true;cb(r)};s.onerror=()=>err();setTimeout(()=>{if(!done)err()},15000);
 s.src='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=responseHandler:'+n+'&headers=1&tq='+encodeURIComponent("select A,B where B contains 'ibni'")+'&_='+Date.now();document.head.appendChild(s)}
function gdate(v){if(!v)return 0;const m=String(v).match(/Date\((\d+),(\d+),(\d+),?(\d+)?,?(\d+)?,?(\d+)?/);return m?new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0)).getTime():0}
function load(){if(!C.sheet){render();return}ROWS=null;ERR='';render();
 gviz(C.sheet,r=>{ROWS=(r.table.rows||[]).map(x=>{let o={};try{o=JSON.parse(x.c[1]&&(x.c[1].v||x.c[1].f)||'{}')}catch(e){}o.ts=gdate(x.c[0]&&x.c[0].v);return o}).filter(o=>o.event==='ibni'&&o.pid);render()},
 ()=>{ERR='تعذّرت قراءة الشيت. يجب أن يكون مشاركاً «Anyone with the link».';render()})}
function parse(s){const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)}
function dayNow(start){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-parse(start))/864e5)+1}
function ago(ts){if(!ts)return '—';const h=(Date.now()-ts)/36e5;return h<1?'الآن':h<24?'قبل '+Math.round(h)+' س':'قبل '+Math.round(h/24)+' ي'}
const ST=['لم تتم','على الأقل','كاملة'];
function people(){const P={};ROWS.slice().sort((a,b)=>a.ts-b.ts).forEach(o=>{const p=P[o.pid]=P[o.pid]||{pid:o.pid,reps:{},first:o.ts};
 Object.assign(p,{ig:o.ig||p.ig,wa:o.wa||p.wa,mail:o.mail||p.mail,name:o.name,age:o.age,country:o.country,start:o.start,habits:o.habits||p.habits,done:o.done,chain:o.chain,last:o.ts});
 if(o.m0)p.m0=o.m0;if(o.m21)p.m21=o.m21;if(o.a==='report'&&o.day)p.reps[o.day]=o;if(o.a==='cert')p.cert=1;});
 return Object.values(P).map(p=>{p.day=Math.min(Math.max(dayNow(p.start),0),99);p.lastRep=Math.max(0,...Object.values(p.reps).map(r=>r.ts));
  const today=Math.min(p.day,N);let miss=0;for(let d=today-1;d>=1&&d>=today-3;d--){if(!p.reps[d])miss++;else break}p.miss=miss;return p}).sort((a,b)=>b.last-a.last)}
function repText(r){const L=['اليوم '+r.day+'/21 · النتيجة '+r.score+'%'];const q=r.q||{};
 L.push('النوم: '+(q.sleep||'—')+' · الاستيقاظ: '+(q.wake||'—'));L.push('الفجر: '+(q.fajr===2?'في وقتها':q.fajr===0?'فاتت':'—'));
 L.push('الصلوات: '+(r.p||[]).filter(v=>v===2).length+'/5 في وقتها');L.push('مهمة اليوم: '+(r.m==null?'—':ST[r.m]));
 L.push('أصعب لحظة: '+(q.hard||'—'));L.push('أفخر بـ: '+(q.proud||'—'));
 Object.entries(r.h||{}).forEach(([k,v])=>L.push((v===2?'✓ ':v===1?'◐ ':'✕ ')+k));return L.join('\n')}
const MQ=[['sleep','النوم'],['wake','الاستيقاظ'],['pr','الصلوات في وقتها'],['fajr','الفجر/أسبوع'],['phone','ساعات الهاتف'],['sport','التمرين/أسبوع']];
function meas(p){if(!p.m0)return '<div class="note" style="margin-top:8px">لم يملأ قياس اليوم 0 بعد.</div>';const a=p.m0,b=p.m21||{};
 let h='<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:4px 8px;margin-top:12px;font-size:13px;background:#080808;border:1px solid #1e1e1e;border-radius:12px;padding:10px"><span></span><span style="color:var(--dim);text-align:center">اليوم 0</span><span style="color:var(--red);text-align:center;font-weight:800">اليوم 21</span>';
 MQ.forEach(([k,l])=>{h+=`<span style="color:var(--mute)">${l}</span><span style="text-align:center">${esc(a[k]==null?'—':a[k])}</span><span style="text-align:center;font-weight:800">${esc(b[k]==null?'—':b[k])}</span>`});
 h+='</div>';if(a.pain)h+=`<div class="note" style="margin-top:6px"><b style="color:#fff">ما يؤلمه:</b> ${esc(a.pain)}</div>`;if(a.why)h+=`<div class="note"><b style="color:#fff">لماذا:</b> ${esc(a.why)}</div>`;
 if(b.change)h+=`<div class="note"><b style="color:#fff">ما تغيّر:</b> ${esc(b.change)}</div>`;if(p.m21)h+=`<div class="note" style="color:${b.ok?'#fff':'#ff9aa8'}">${b.ok?'✓ يسمح بنشر أرقامه دون اسم':'✕ لا يسمح بالنشر'}</div>`;return h}
function render(){const A=document.getElementById('app');
 if(!C.sheet){A.innerHTML=`<div class="f"><b>ربط الشيت (مرة واحدة)</b><p class="note">رابط شيت أجوبة الفورم، نفس الشيت المستعمل في لوحة المحاربين ولوحة العروض. يُحفظ في هذا الهاتف فقط.</p><input id="s" placeholder="https://docs.google.com/spreadsheets/d/..."><button class="btn" onclick="C.sheet=sid(document.getElementById('s').value);try{localStorage.setItem(K,JSON.stringify(C))}catch(e){};load()">حفظ</button></div>`;return}
 if(ERR){A.innerHTML=`<div class="f">${ERR}</div><div style="height:10px"></div><button class="btn" onclick="C.sheet='';render()">تغيير الرابط</button>`;return}
 if(!ROWS){A.innerHTML='<div class="empty">جاري التحميل…</div>';return}
 const all=people();
 if(!all.length){A.innerHTML='<div class="empty">لا يوجد مشتركون بعد.<br>يظهر كل مشترك هنا عند التسجيل في التطبيق.</div>';return}
 const ages=all.map(p=>+p.age).filter(Boolean),avg=ages.length?Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):'—';
 const today=all.filter(p=>p.lastRep&&Date.now()-p.lastRep<20*36e5).length;
 const C2={};all.forEach(p=>{const k=(p.country||'—').trim();C2[k]=(C2[k]||0)+1});const cMax=Math.max(...Object.values(C2));
 let h=`<div class="kpi"><div><b>${all.length}</b><small>مشترك</small></div><div><b>${today}</b><small>أرسل تقرير اليوم</small></div><div><b>${avg}</b><small>متوسط العمر</small></div></div>
 <h2>حسب البلد</h2><div class="card bars">${Object.entries(C2).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="r"><span>${esc(k)}</span><i style="width:${Math.max(6,v/cMax*100)*0.6}%"></i><em>${v}</em></div>`).join('')}</div>
 <div class="tabs">${[['all','الكل'],['late','بلا تقرير يومين'],['done','الناجحون'],['young','حسب العمر']].map(([k,l])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';render()">${l}</button>`).join('')}</div><div style="height:10px"></div>`;
 let L=all;if(TAB==='late')L=all.filter(p=>p.miss>=2&&p.day>2);if(TAB==='done')L=all.filter(p=>p.cert||(p.day>=N&&p.done>=15));if(TAB==='young')L=all.slice().sort((a,b)=>(+a.age||99)-(+b.age||99));
 if(!L.length)h+='<div class="empty">لا أحد هنا.</div>';
 L.forEach(p=>{const reps=Object.values(p.reps),dn=Math.min(Math.max(p.day,0),N);
  let badge=p.day<1?`<span class="badge">يبدأ بعد ${1-p.day} ي</span>`:p.cert||(p.day>=N&&p.done>=15)?'<span class="badge ok">ناجح</span>':p.miss>=2?`<span class="badge warn">بلا تقرير ${p.miss} أيام</span>`:`<span class="badge">اليوم ${dn}/21</span>`;
  let ch='';for(let d=1;d<=N;d++){const r=p.reps[d];ch+=`<i class="${r?(r.score>=80?'d':'p'):''}"></i>`}
  const hs=(p.habits||[]).map(t=>{const v=reps.map(r=>r.h&&r.h[t]).filter(x=>x!=null&&x!==undefined);const ok=reps.filter(r=>r.h&&(r.h[t]===2||r.h[t]===1)).length;const pc=reps.length?Math.round(ok/reps.length*100):0;return `<div><div class="r"><span>${esc(t)}</span><em>${pc}%</em></div><div class="pb"><i style="width:${pc}%"></i></div></div>`}).join('');
  const lastR=reps.sort((a,b)=>b.day-a.day)[0];
  h+=`<div class="sub"><div class="hd"><div class="av">${esc((p.name||'?').trim()[0]||'?')}</div><div class="nm"><b>${esc(p.name)}</b><small>${esc(p.age||'—')} سنة · ${esc(p.country||'—')}</small></div>${badge}</div>
  <div class="stats">${p.wa?`<a href="https://wa.me/${esc(String(p.wa).replace(/\D/g,''))}" style="color:var(--red);font-weight:800;text-decoration:none;direction:ltr">واتساب <bdi dir="ltr">${esc(p.wa)}</bdi></a>`:''}${p.ig?`<a href="https://instagram.com/${esc(p.ig)}" style="color:#fff;font-weight:700;text-decoration:none"><bdi dir="ltr">@${esc(p.ig)}</bdi></a>`:''}${p.mail?`<a href="mailto:${esc(p.mail)}" style="color:var(--mute);text-decoration:none;direction:ltr">${esc(p.mail)}</a>`:''}</div>
  <div class="stats"><span>أيام ملتزمة <b>${p.done||0}</b>/21</span><span>السلسلة <b>${p.chain||0}</b></span><span>آخر تقرير <b>${ago(p.lastRep)}</b></span></div>
  <div class="chain">${ch}</div>
  ${meas(p)}
  <div class="hb">${hs}</div>
  ${lastR?`<button class="more" onclick="OPEN['${p.pid}']=!OPEN['${p.pid}'];render()">${OPEN[p.pid]?'إخفاء التقارير':'التقارير ('+reps.length+')'}</button>${OPEN[p.pid]?reps.map(r=>`<div class="rep">${esc(repText(r))}</div>`).join(''):''}`:'<div class="note" style="margin-top:8px">لم يُرسل أي تقرير بعد.</div>'}
  </div>`});
 h+=`<div style="text-align:center;margin-top:20px"><button class="note" onclick="C.sheet='';try{localStorage.setItem(K,JSON.stringify(C))}catch(e){};render()">تغيير الشيت</button></div>`;
 A.innerHTML=h}
load();
</script>
</body>
</html>
