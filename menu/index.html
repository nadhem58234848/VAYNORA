<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<script>
/* القيم هاذي تتبدل وحدها من الجدول (سطور "إعدادات"). ما يلزمكش تبدل الكود. */
const CFG = {
  name: "مطعم الزيتونة",
  tagline: "ماكلة دار · سهلول، سوسة",
  phone: "21658886475",            // واتساب المطعم بلا + (216 + الرقم)
  sheet: "",
  hours: "كل يوم 11:00 – 23:00",
  address: "سهلول، سوسة",
  maps: "https://maps.google.com/?q=Sahloul+Sousse",
  review: "",                       // رابط "اكتب تقييم" من Google (اختياري)
  color: "#2E5E3A",                 // اللون الرئيسي
  accent: "#F2C14E",                // لون ثاني
  currency: "د"
};
const P=new URLSearchParams(location.search);
if(P.get('s'))CFG.sheet='https://docs.google.com/spreadsheets/d/e/'+P.get('s')+'/pub?output=csv';
else if(P.get('csv'))CFG.sheet=P.get('csv');
</script>
<style>
:root{--c:#2E5E3A;--a:#F2C14E;--bg:#FBF7F0;--card:#fff;--t:#1b1b1b;--m:#6b665e;--ln:#ebe3d5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:110px}
header{background:var(--c);color:#fff;padding:34px 18px 22px;text-align:center}
header h1{font-weight:800;font-size:30px}
header p{opacity:.85;font-size:15px;margin-top:2px}
.info{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.info a,.info span{background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:999px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1.5px solid var(--c);background:transparent;color:var(--c);font:inherit;font-weight:700;font-size:14px;padding:6px 16px;border-radius:999px}
nav button.on{background:var(--c);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 14px}
h2{font-weight:800;font-size:20px;color:var(--c);margin:22px 4px 10px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-weight:700;font-size:17px}
.it small{display:block;color:var(--m);font-size:13px;line-height:1.5}
.it .pr{font-weight:800;color:var(--c);font-size:16px;margin-top:2px}
.it.off{opacity:.45}
.it.off .pr:after{content:" · غير متوفر توا";font-weight:600;color:var(--m);font-size:12px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:34px;height:34px;border-radius:50%;border:none;background:var(--c);color:#fff;font:inherit;font-size:20px;font-weight:800;line-height:1}
.q button.mn{background:var(--ln);color:var(--t)}
.q span{min-width:16px;text-align:center;font-weight:800}
.bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--c);color:#fff;border-radius:18px;padding:14px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.25);border:none;font:inherit;width:auto}
.bar.show{display:flex}
.bar b{font-weight:800;font-size:17px}
.bar .tot{background:var(--a);color:#1b1b1b;font-weight:800;padding:4px 12px;border-radius:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.pane{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.pane h3{font-weight:800;font-size:20px;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:15px}
.ln.t{font-weight:800;border:none;font-size:17px;margin-top:4px}
.seg{display:flex;gap:8px;margin:14px 0 10px}
.seg label{flex:1;text-align:center;border:1.5px solid var(--ln);border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.seg input{display:none}
.seg input:checked+span{color:var(--c)}
.seg label:has(input:checked){border-color:var(--c);background:rgba(0,0,0,.03)}
textarea,input[type=text]{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:6px}
.go{display:block;width:100%;margin-top:14px;border:none;border-radius:14px;background:#25D366;color:#fff;font:inherit;font-weight:800;font-size:17px;padding:14px}
.x{background:none;border:none;font:inherit;color:var(--m);width:100%;margin-top:8px;padding:8px}
footer{text-align:center;color:var(--m);font-size:12px;margin:30px 0 10px}
footer a{color:var(--m)}
.msg{text-align:center;color:var(--m);padding:40px 10px}
</style>
</head>
<body>
<header>
  <h1 id="nm"></h1><p id="tg"></p>
  <div class="info" id="info"></div>
</header>
<nav id="nav"></nav>
<main id="menu"><p class="msg">جاري تحميل المنيو…</p></main>
<footer id="ft"></footer>

<button class="bar" id="bar"><b>طلبيتك (<span id="cnt">0</span>)</b><span class="tot" id="tot"></span></button>

<div class="sheet" id="sheet"><div class="pane">
  <h3>طلبيتك</h3>
  <div id="lines"></div>
  <div class="seg">
    <label><input type="radio" name="tp" value="توصيل" checked><span>🚚 توصيل</span></label>
    <label><input type="radio" name="tp" value="نجي ناخذها"><span>🛍️ نجي ناخذها</span></label>
    <label><input type="radio" name="tp" value="على الطاولة"><span>🍽️ على الطاولة</span></label>
  </div>
  <input type="text" id="who" placeholder="الاسم">
  <textarea id="note" rows="2" placeholder="العنوان / رقم الطاولة / ملاحظة"></textarea>
  <button class="go" id="go">ابعث الطلبية على واتساب</button>
  <button class="x" id="cl">رجوع للمنيو</button>
</div></div>

<script>
const $=s=>document.querySelector(s);
const cart={};let items=[];
function setup(){
document.documentElement.style.setProperty('--c',CFG.color);
document.documentElement.style.setProperty('--a',CFG.accent);
document.title=CFG.name+' · المنيو';
$('#nm').textContent=CFG.name;$('#tg').textContent=CFG.tagline;
const info=[];
if(CFG.hours)info.push(`<span>🕚 ${CFG.hours}</span>`);
if(CFG.maps)info.push(`<a href="${CFG.maps}" target="_blank" rel="noopener">📍 ${CFG.address||'الطريق'}</a>`);
if(CFG.phone)info.push(`<a href="tel:+${CFG.phone}">📞 اتصل</a>`);
if(CFG.review)info.push(`<a href="${CFG.review}" target="_blank" rel="noopener">⭐ قيّمنا</a>`);
$('#info').innerHTML=info.join('');
$('#ft').innerHTML=(CFG.review?`<a href="${CFG.review}" target="_blank" rel="noopener">عجبتك الماكلة؟ قيّمنا على Google ⭐</a><br>`:'')+'صُنع بواسطة ناظم · محتوى وتصميم';

}
function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*1000)/1000).toString().replace('.',',')+' '+CFG.currency;

async function load(){
  const src=CFG.sheet?CFG.sheet+(CFG.sheet.includes('?')?'&':'?')+'t='+Date.now():'demo.csv?t='+Date.now();
  try{
    const r=await fetch(src);if(!r.ok)throw 0;
    const all=parseCSV(await r.text()).slice(1);
    const K={'الاسم':'name','الوصف':'tagline','واتساب':'phone','الأوقات':'hours','العنوان':'address','الخريطة':'maps','التقييم':'review','اللون':'color','اللون2':'accent','العملة':'currency'};
    all.filter(x=>(x[0]||'').trim()=='إعدادات').forEach(x=>{const k=K[(x[1]||'').trim()];if(k&&(x[2]||'').trim())CFG[k]=x[2].trim().replace(/^\+/,'').replace(/\s/g,k=='phone'?'':' ')});
    if(CFG.phone&&CFG.phone.length==8)CFG.phone='216'+CFG.phone;
    setup();
    const rows=all.filter(x=>(x[0]||'').trim()!='إعدادات');
    items=rows.map((x,i)=>({id:i,cat:(x[0]||'').trim()||'المنيو',name:(x[1]||'').trim(),desc:(x[2]||'').trim(),
      price:parseFloat(String(x[3]||'0').replace(',','.'))||0,on:!/^(لا|no|0|non)$/i.test((x[4]||'').trim())})).filter(x=>x.name).map((x,i)=>(x.id=i,x));
    render();
  }catch(e){setup();$('#menu').innerHTML='<p class="msg">ما نجمناش نحلّو المنيو. عاود جرّب بعد شوية.</p>'}
}
function render(){
  const cats=[...new Set(items.map(x=>x.cat))];
  $('#nav').innerHTML=cats.map((c,i)=>`<button data-i="${i}" class="${i?'':'on'}">${esc(c)}</button>`).join('');
  $('#menu').innerHTML=cats.map((c,i)=>`<h2 id="c${i}">${esc(c)}</h2>`+items.filter(x=>x.cat==c).map(x=>`
    <div class="it ${x.on?'':'off'}"><div class="tx"><b>${esc(x.name)}</b>${x.desc?`<small>${esc(x.desc)}</small>`:''}<div class="pr">${fmt(x.price)}</div></div>
    ${x.on&&CFG.phone?`<div class="q"><button class="mn" data-d="-1" data-id="${x.id}" aria-label="نقص">−</button><span id="q${x.id}">${cart[x.id]||0}</span><button data-d="1" data-id="${x.id}" aria-label="زيد">+</button></div>`:''}
    </div>`).join('')).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
    const h=$('#c'+b.dataset.i);window.scrollTo({top:h.offsetTop-60,behavior:'smooth'})};
  $('#menu').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;
    const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d);if(!cart[id])delete cart[id];
    $('#q'+id).textContent=cart[id]||0;upd()};
}
function sum(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*items[id].price}return{n,t}}
function upd(){const{n,t}=sum();$('#cnt').textContent=n;$('#tot').textContent=fmt(t);$('#bar').classList.toggle('show',n>0)}
$('#bar').onclick=()=>{const{t}=sum();
  $('#lines').innerHTML=Object.keys(cart).map(id=>`<div class="ln"><span>${cart[id]} × ${esc(items[id].name)}</span><span>${fmt(cart[id]*items[id].price)}</span></div>`).join('')+`<div class="ln t"><span>المجموع</span><span>${fmt(t)}</span></div>`;
  $('#sheet').classList.add('show')};
$('#cl').onclick=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id=='sheet')$('#sheet').classList.remove('show')};
$('#go').onclick=()=>{const{t}=sum();
  const tp=document.querySelector('input[name=tp]:checked').value;
  const lines=Object.keys(cart).map(id=>`• ${cart[id]} × ${items[id].name} (${fmt(cart[id]*items[id].price)})`);
  const msg=`السلام عليكم، طلبية من المنيو:\n${lines.join('\n')}\nالمجموع: ${fmt(t)}\nالنوع: ${tp}`+
    ($('#who').value.trim()?`\nالاسم: ${$('#who').value.trim()}`:'')+($('#note').value.trim()?`\nملاحظة: ${$('#note').value.trim()}`:'');
  window.open('https://wa.me/'+CFG.phone+'?text='+encodeURIComponent(msg),'_blank')};
load();
</script>
</body>
</html>
