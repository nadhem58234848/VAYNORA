<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النهار 1</title>
<body style="margin:0;background:#0D0D0D;color:#F4F1EC;font-family:sans-serif;text-align:center;padding:16px">
<h2 style="color:#C81E1E">ريل النهار 1 · نسخة 5</h2>
<button id="dl" style="width:100%;max-width:420px;padding:20px;font-size:24px;font-weight:bold;background:#C81E1E;color:#fff;border:0;border-radius:14px;margin:8px 0 16px">⬇ تحميل الفيديو</button>
<p id="st" style="min-height:24px"></p>
<video src="day1-v5.mp4" controls playsinline style="width:100%;max-width:420px;border-radius:12px"></video>
<script>
const SRC='day1-v5.mp4',NAME='nahar1-v5.mp4',st=document.getElementById('st');
document.getElementById('dl').onclick=async()=>{
  st.textContent='قاعد يتحمّل… استنى';
  try{
    const b=await (await fetch(SRC)).blob(); const f=new File([b],NAME,{type:'video/mp4'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){st.textContent='اختار «Enregistrer la vidéo»';await navigator.share({files:[f]});st.textContent='✅';return;}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=NAME;document.body.appendChild(a);a.click();a.remove();st.textContent='✅ تلقاه في Téléchargements';
  }catch(e){ if(e.name!=='AbortError'){st.textContent='عاود اضغط';} else st.textContent=''; }
};
</script></body></html>
