<textarea id="t">شقّ الله البحر لموسى بضربة عصا، وجعل النار بردًا وسلامًا على إبراهيم، وأحيا يونس في بطن الحوت.
ربّنا عظيم، ولم يطلب منّا إلا صدق النيّة والأخذ بالسبب، والتوفيق منه وحده.

نحارب لديننا وبلادنا بالعلم، ونطبّقه على أنفسنا، ونبتعد عن الشهوات، ونربّي أبناءنا عليه.
قد لا نرى النصر بأعيننا، لكنّنا نمهّد له. كن الشعلة، وسلّم المشعل لمن بعدك.

﴿إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ﴾

النصرة تبدأ من نفسك. اكتب «حرب» وانضمّ إلى تحدّي حرب النفس مجانًا 🔥

#حرب_النفس #اصنع_من_الألم_قوة</textarea>
