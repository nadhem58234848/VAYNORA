<textarea id="t">مسلم؟ ليس هدفك في الحياة أن تعيش لنفسك فقط. راجع نفسك.

إن لم ننصر ديننا نحن الشباب، فمن ينصره؟ وإن لم ننهض ببلادنا، فمن ينهض بها؟

١. العلم والدعوة: نتعلّم ديننا، ونطبّقه على أنفسنا، وندعو إليه بالحكمة.
٢. الصبر والأسرة: ندعو ونصبر، ونربّي أولادنا على الدين.
٣. النهوض لا الهروب: لا نترك بلادنا هربًا منها وكرهًا لها، بل نتحمّل المسؤولية ونصبر على قسوة الظروف لننهض بها.
٤. تطوير الذات: نطوّر أنفسنا ونبتعد عن الشهوات.
٥. الله قادر: طلب منّا سببًا ولو بسيطًا، والتوفيق منه وحده.
٦. وإن لم نرَ النصر بأعيننا، فلنمهّد له، ونربّي أولادنا على هذه الدعوة ليعيشوه هم.

﴿إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ﴾

اكتب «حرب» وابدأ اليوم مع تحدّي حرب النفس مجانًا 🔥

#حرب_النفس #اصنع_من_الألم_قوة</textarea>
