<textarea id="t">الجدول اليومي الذي سيغيّر حياتك 180° 🔥

الصلاة في وقتها، الرواتب، القرآن، قيام الليل، الأخلاق، والطاعات اليومية.
ثم روتيني على الجبهات الأربع: الروح، الجسد، العقل، المال.
لا تحاول أن تفعلها كلّها غدًا: ابدأ بالصلاة في وقتها، ثم أضف عملًا واحدًا كل أسبوع.

تعرف الجدول، والمشكلة أن تثبت عليه.
برنامج «ابنِ نفسك» 21 يومًا معي: مهمّة كل صباح، تقرير كل ليلة، ومتابعة على الجبهات الأربع حتى يصبح الجدول عادتك.
الرابط في البايو 👆

احفظ المنشور، وأرسله لمن تريد له الخير.
