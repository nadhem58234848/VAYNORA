<textarea id="t">أخطر عدوٍّ لك لا يقف أمامك... بل يسكن داخلك. ⚔️

نفسُك تكذب عليك كلَّ يوم بصوتٍ هادئ ومقنع:
«غدًا»، «يومٌ واحد لن يضر»، «انتهى كلُّ شيء»...
وكلُّ كذبةٍ تصدّقها، تخسر بها يومًا من عمرك.

أيُّ واحدةٍ منها تسمعها أكثر؟ اكتب رقمها في التعليقات 👇

أرسِلها لصديقٍ يقول دائمًا «غدًا»، واحفظها لتعود إليها حين تكذب عليك نفسُك.

تريد أن تبني انضباطك وتطوّر ذاتك؟ الرابط في البايو.

#حرب_النفس #اصنع_من_الألم_قوة #انضباط #تطوير_الذات #جهاد_النفس</textarea>
