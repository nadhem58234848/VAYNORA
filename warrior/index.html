:root{--bg:#0d0d0d;--card:#171717;--card2:#202020;--line:#2c2c2c;--tx:#f2f2f2;--mut:#9a9a9a;--red:#e0262b;--grn:#2fbf71;--amb:#e6a23c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;font-weight:600}
body{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
h1{font-weight:800;font-size:22px}
h2{font-weight:800;font-size:17px;margin-bottom:8px}
h3{font-weight:800;font-size:15px;margin:12px 0 6px}
p{line-height:1.75;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.red{color:var(--red)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:800 16px Cairo;background:var(--red);color:#fff;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.grn{background:var(--grn)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:600 15px Cairo;padding:12px;margin-top:6px}
textarea{min-height:76px;resize:vertical}
label{display:block;margin-top:12px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:800;letter-spacing:2px;font-size:13px;color:var(--red)}
.big{font-size:52px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--mut)}
.phase{display:inline-block;font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.task{font-size:17px;line-height:1.8;font-weight:800}
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.chk:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #555;flex:none;display:grid;place-items:center;font-size:16px}
.chk.on .box{background:var(--grn);border-color:var(--grn)}
.chk small{display:block;color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--card2);font-size:10px;display:grid;place-items:center;color:var(--mut)}
.cell.c{background:var(--grn);color:#062}
.cell.t{background:#1d4d33;color:#cfe}
.cell.f{background:#5a1a1c;color:#fcc}
.cell.now{outline:2px solid var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:520px;width:100%;display:flex}
.nav button{flex:1;background:none;border:0;color:var(--mut);font:800 12px Cairo;padding:10px 0 12px}
.nav button i{display:block;font-style:normal;font-size:20px}
.nav button.on{color:var(--tx)}
.sos{background:linear-gradient(135deg,#e0262b,#9c1418);border:0}
.sos .btn{background:#fff;color:#a01518}
ol{padding-right:20px;line-height:1.8;font-size:15px}
ol li{margin-bottom:4px}
.timer{font-size:64px;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0}

return `<div class="top"><h1>🗺️ الطريق</h1></div>
<div class="card"><div class="grid">${c}</div>
<p class="mut" style="margin-top:12px">🟩 نظيف · 🟫 المهمة برك · 🟥 طيحة · الإطار الأحمر = اليوم</p></div>
${PH.map(p=>`<div class="card"><h2>${p[2]}</h2><p class="mut">الأيام ${p[0]} - ${p[1]} · ${p[3]}</p></div>`).join('')}
<div class="card"><h2>📝 المراجعات الأسبوعية</h2>${Array.from({length:13},(_,i)=>i+1).map(w=>`<button class="btn sec" data-w="${w}" ${w*7>n+6&&!(S.reviews[w])?'disabled':''}>الجمعة ${w} ${S.reviews[w]?'✓':''}</button>`).join('')}</div>
<div class="card"><h2>📋 مهام كل الأيام</h2><p class="mut">اضغط على نهار في الخريطة باش تشوف مهمتو.</p><div id="dt"></div></div>`}
function bindMap(){document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{const i=+e.dataset.d;$('#dt').innerHTML=`<h3>النهار ${i}</h3><p>${T[i-1]}</p>`;$('#dt').scrollIntoView({behavior:'smooth'})});
document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{revWeek=+e.dataset.w;go('review')})}

let revWeek=1;
function vReview(){const r=S.reviews[revWeek]||[];return `<div class="top"><h1>📝 مراجعة الجمعة ${revWeek}</h1></div>
<div class="card"><p class="mut">5 أسئلة من الكتاب. جاوب بصدق، حتى حد ما يقرا كان إنت.</p>
${REVIEW.map((q,i)=>`<label>${i+1}. ${q}<textarea data-q="${i}">${esc(r[i])}</textarea></label>`).join('')}
<button class="btn" id="sv">نسجّل المراجعة</button><button class="btn sec" data-go="home">رجوع</button></div>`}
function bindReview(){$('#sv').onclick=()=>{S.reviews[revWeek]=[...document.querySelectorAll('[data-q]')].map(t=>t.value);save();toast('تسجّلت. كافئ روحك بحاجة حلال 🤍');go('home')};document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go))}

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function vSos(){return `<div class="top"><h1>🆘 نجدة</h1></div>
<div class="card sos" style="text-align:center"><p>الرغبة كيف الموجة: تطلع، توصل للقمة، وتهبط. ما يلزمكش تغلبها الكل، يلزمك تصبر <b>10 دقايق</b> برك.</p>
<div class="timer" id="tm">${fmt(tLeft)}</div><button class="btn" id="ts">${tOn?'⏸ وقّف':'▶ ابدا الـ10 دقايق'}</button></div>
<div class="card"><h2>خطة المحارب: 10 دقايق</h2><p class="mut">اعمل وحدة وحدة، واضغط عليها كي تكمّلها.</p>
${TEN.map((s,i)=>`<div class="step ${sosSteps[i]?'on':''}" data-s="${i}"><span class="box">${sosSteps[i]?'✓':''}</span><div>${s}</div></div>`).join('')}</div>
<div class="card"><h2>القواعد الذهبية</h2><ol>${GOLD.map(g=>`<li>${g}</li>`).join('')}</ol></div>
<div class="card"><h2>3 أسئلة قبل أي قرار</h2><ol>${Q3.map(g=>`<li>${g}</li>`).join('')}</ol></div>
${S.ifthen.some(x=>x)?`<div class="card"><h2>قراراتك اللي خذيتها وإنت هادي</h2><ol>${S.ifthen.filter(x=>x).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}
<div class="card"><h2>ما تبقاش وحدك</h2>
${S.contact?`<p>الشخص اللي تكلمو: <b>${esc(S.contact)}</b></p>`:''}
<a class="btn sec" href="https://ig.me/m/${IG}" target="_blank">ابعث لنذهم في إنستا</a>
<a class="btn sec" href="https://wa.me/${WA}?text=${encodeURIComponent('نجدة 🆘')}" target="_blank">ابعث «نجدة» في واتساب</a>
<p class="mut" style="margin-top:8px">نذهم يجاوب كي ينجم، موش ديما في الحين. الخطة اللي فوق هي اللي تنقذك في اللحظة.</p></div>
<div class="quote">«إِنَّمَا الصَّبْرُ عِنْدَ الصَّدْمَةِ الأُولَى» · متفق عليه</div>`}
function tick(){if(!tOn)return;tLeft--;const e=$('#tm');if(e)e.textContent=fmt(tLeft);if(tLeft<=0){clearInterval(tmr);tOn=false;tLeft=600;if(navigator.vibrate)navigator.vibrate([200,100,200]);if(view==='sos')render();const n=dayNo();if(n>=1&&n<=90){const d=D(n);d.wins=(d.wins||0)+1;save()}toast('عدّت الموجة! إنت أقوى مما ظنّيت 💪')}}
function bindSos(){$('#ts').onclick=()=>{tOn=!tOn;if(tOn){clearInterval(tmr);tmr=setInterval(tick,1000)}else clearInterval(tmr);render()};
document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{sosSteps[e.dataset.s]=!sosSteps[e.dataset.s];render()})}

function vFall(){return `<div class="top"><h1>طحت؟ قوم.</h1></div>
<div class="card"><p>الزلّة حدث، أما الاستسلام فقرار. الضرر الكبير موش في الزلّة، في الفكرة اللي بعدها: «وفى كل شي».</p>
<div class="quote">«وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا»</div></div>
<div class="card"><h2>بروتوكول أول ساعة</h2>${FIRST.map((s,i)=>`<div class="step" data-f="${i}"><span class="box"></span><div>${s}</div></div>`).join('')}</div>
<div class="card"><h2>اكتب بهدوء</h2><p class="mut">من غير ما توصف المحتوى. هذا يتسجّل عندك برك.</p>
<label>وقتاش ووين؟<input id="f1"></label>
<label>شنوة الإحساس اللي كان قبلها؟<input id="f2"></label>
<label>شنوة المحفز؟<input id="f3"></label>
<label>شنوة كان تنجم تعمل؟ وكيفاش تسدّ الثغرة؟<textarea id="f4"></textarea></label>
<button class="btn" id="fs">نسجّل ونعاود العد</button>
<p class="mut" style="margin-top:8px">العداد يرجع للصفر، إيه. أما الخبرة ما تتمحاش. قول: «اليوم الأول من جديد، وأنا أقوى مما كنت».</p></div>`}
function bindFall(){document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{e.classList.toggle('on');e.querySelector('.box').textContent=e.classList.contains('on')?'✓':''});
$('#fs').onclick=()=>{const n=dayNo();if(n>=1&&n<=90){D(n).clean=false}S.falls.push({day:n,date:today(),w:$('#f1').value,f:$('#f2').value,t:$('#f3').value,fix:$('#f4').value});save();toast('كمّل خطتك اليوم. الله يحب التوّابين 🤍');go('home')}}

function vPlan(){return `<div class="top"><h1>🛡️ خطتي</h1></div>
<div class="card"><h2>علاش بديت؟ (3 أسباب كبرى)</h2>${[0,1,2].map(i=>`<input data-y="${i}" value="${esc(S.why[i])}" placeholder="السبب ${i+1}">`).join('')}</div>
<div class="card"><h2>جمل «إذا... فإن»</h2><p class="mut">قرارك وإنت هادي أقوى من قرارك وإنت مشتعل. تظهرلك في صفحة النجدة.</p>
<p class="mut" style="margin-top:6px">مثال: إذا حسّيت بالملل بعد العشاء، نخرج نتمشى ولا نكلم صاحبي.</p>
${[0,1,2].map(i=>`<input data-i="${i}" value="${esc(S.ifthen[i])}" placeholder="إذا ... باش ...">`).join('')}</div>
<div class="card"><h2>الشخص اللي نكلمو كي نضعف</h2><input id="ct" value="${esc(S.contact)}" placeholder="الاسم والنمرة"></div>
<button class="btn" id="ps">نسجّل</button>
${S.falls.length?`<div class="card" style="margin-top:12px"><h2>دروس من الطيحات (${S.falls.length})</h2>${S.falls.slice(-5).reverse().map(f=>`<p class="mut">النهار ${f.day}: ${esc(f.t||f.f||'—')}${f.fix?' ← '+esc(f.fix):''}</p>`).join('')}</div>`:''}`}
function bindPlan(){$('#ps').onclick=()=>{S.why=[0,1,2].map(i=>$(`[data-y="${i}"]`).value);S.ifthen=[0,1,2].map(i=>$(`[data-i="${i}"]`).value);S.contact=$('#ct').value;save();toast('تسجّلت ✓')}}

let delArm=false;
function vSet(){return `<div class="top"><h1>⚙️ إعدادات</h1></div>
<div class="card"><label>اسمك<input id="sn" value="${esc(S.name)}"></label><label>تاريخ البداية<input id="sd" type="date" value="${esc(S.start)}"></label><button class="btn" id="ss">نسجّل</button></div>
<div class="card"><h2>📲 حطّو في الشاشة الرئيسية</h2><p class="mut">آيفون: Safari ← زر المشاركة ← «إضافة إلى الشاشة الرئيسية». أندرويد: Chrome ← ⋮ ← «إضافة للشاشة الرئيسية».</p></div>
<div class="card"><h2>🔒 الخصوصية</h2><p class="mut">بياناتك في هالتليفون وهالمتصفح برك. ما تتبعث لحتى حد. كان تفسخ بيانات المتصفح، تتفسخ معاها.</p></div>
<div class="card"><h2>📖 الكتاب</h2><p class="mut">كل المهام من كتاب «معركة الخلوات» (الفصول 6، 7، 8) لنذهم العاشق.</p><a class="btn sec" href="https://nadhem58234848.github.io/VAYNORA/book.html" target="_blank">صفحة الكتاب</a></div>
<div class="card"><button class="btn sec" id="rs">${delArm?'متأكد؟ اضغط مرة أخرى باش تفسخ الكل':'نبدا من الصفر'}</button></div>`}
function bindSet(){$('#ss').onclick=()=>{S.name=$('#sn').value.trim()||S.name;S.start=$('#sd').value||S.start;save();toast('تسجّلت ✓');go('home')};
$('#rs').onclick=()=>{if(!delArm){delArm=true;render();setTimeout(()=>{delArm=false;if(view==='set')render()},4000);return}try{localStorage.removeItem(K)}catch(e){}location.reload()}}

const V={home:[vHome,bindHome],map:[vMap,bindMap],review:[vReview,bindReview],sos:[vSos,bindSos],fall:[vFall,bindFall],plan:[vPlan,bindPlan],set:[vSet,bindSet]};
function render(){if(!S.start){$('#nav').classList.add('hide');$('#app').innerHTML=vWelcome();bindWelcome();return}
$('#nav').classList.remove('hide');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='review'&&b.dataset.v==='map')||(view==='fall'&&b.dataset.v==='home')));
const [v,b]=V[view]||V.home;$('#app').innerHTML=v();b()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')render()});
render();
</script>
</body>
</html>
